<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haven Kitchen Bookings</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
}

#loginBox {
  background: white;
  padding: 25px;
  border-radius: 12px;
  max-width: 400px;
  margin: 60px auto;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

#loginBox input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 7px 0;
  font-size: 16px;
}

button {
  padding: 10px 15px;
  font-size: 16px;
  cursor: pointer;
  border: 0;
  border-radius: 7px;
}

.loginButton {
  width: 100%;
  margin-top: 10px;
}

#error {
  color: red;
  margin-top: 10px;
}

#dashboard {
  display: none;
}

.top {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
}

input[type="date"] {
  padding: 9px;
  font-size: 16px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,.1);
}

.time {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 6px;
}

.status {
  margin-top: 8px;
  margin-bottom: 12px;
  font-weight: bold;
}

.statusButtons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.confirmedButton {
  background: #e3f2fd;
}

.arrivedButton {
  background: #e8f5e9;
}

.cancelledButton {
  background: #ffebee;
}

.logout {
  display: block;
  margin: 20px auto;
}
</style>
</head>

<body>

<div class="container">

<div id="loginBox">

<h2>Haven Kitchen</h2>
<p>Booking Dashboard Login</p>

<input
  type="email"
  id="email"
  placeholder="Email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button
  class="loginButton"
  onclick="login()">
  Login
</button>

<div id="error"></div>

</div>


<div id="dashboard">

<h1>Haven Kitchen Bookings</h1>

<div class="top">

<button onclick="changeDay(-1)">
←
</button>

<input
  type="date"
  id="datePicker"
>

<button onclick="changeDay(1)">
→
</button>

</div>

<div id="bookings"></div>

<button
  class="logout"
  onclick="logout()">
Logout
</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://uxyedciaiesddyeibqkt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TG1Ym_DZwv7iKg2fZEIpog_XwrvTc0R";


let accessToken = null;

const picker =
document.getElementById("datePicker");


async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  error.innerText = "";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      error.innerText =
        "Email or password is incorrect.";
      return;
    }

    accessToken = data.access_token;

    sessionStorage.setItem(
      "booking_access_token",
      accessToken
    );

    showDashboard();

  } catch (err) {

    error.innerText =
      "Could not connect. Please try again.";

  }
}


function showDashboard() {

  document.getElementById("loginBox")
    .style.display = "none";

  document.getElementById("dashboard")
    .style.display = "block";

  picker.value =
    new Date().toISOString().split("T")[0];

  loadBookings();
}


async function loadBookings() {

  if (!accessToken) return;

  const date = picker.value;

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/bookings?booking_date=eq.${date}&order=booking_time.asc`,
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization":
          `Bearer ${accessToken}`
      }
    }
  );

  const list =
    document.getElementById("bookings");

  if (!response.ok) {

    list.innerHTML =
      "<p>Could not load bookings.</p>";

    return;
  }

  const data = await response.json();

  list.innerHTML = "";

  if (data.length === 0) {

    list.innerHTML =
      "<p>No bookings for this day.</p>";

    return;
  }


  data.forEach(booking => {

    list.innerHTML += `
      <div class="card">

        <div class="time">
          ${booking.booking_time}
        </div>

        <div>
          <strong>${booking.name}</strong>
        </div>

        <div>
          Phone: ${booking.phone || "-"}
        </div>

        <div>
          Guests: ${booking.guests || "-"}
        </div>

        ${
          booking.notes
          ? `<div>Notes: ${booking.notes}</div>`
          : ""
        }

        <div class="status">
          Status:
          ${booking.status || "confirmed"}
        </div>

        <div class="statusButtons">

          <button
            class="confirmedButton"
            onclick="updateStatus(${booking.id}, 'confirmed')">
            Confirmed
          </button>

          <button
            class="arrivedButton"
            onclick="updateStatus(${booking.id}, 'arrived')">
            Arrived
          </button>

          <button
            class="cancelledButton"
            onclick="updateStatus(${booking.id}, 'cancelled')">
            Cancelled
          </button>

        </div>

      </div>
    `;

  });

}


async function updateStatus(id, status) {

  if (!accessToken) return;

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}`,
      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            `Bearer ${accessToken}`,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=minimal"
        },

        body: JSON.stringify({
          status: status
        })
      }
    );

    if (!response.ok) {

      alert(
        "Status could not be updated."
      );

      return;
    }

    loadBookings();

  } catch (err) {

    alert(
      "Status could not be updated."
    );

  }

}


function changeDay(days) {

  const date =
    new Date(
      picker.value + "T00:00:00"
    );

  date.setDate(
    date.getDate() + days
  );

  picker.value =
    date.toISOString().split("T")[0];

  loadBookings();
}


picker.addEventListener(
  "change",
  loadBookings
);


function logout() {

  sessionStorage.removeItem(
    "booking_access_token"
  );

  accessToken = null;

  document.getElementById("dashboard")
    .style.display = "none";

  document.getElementById("loginBox")
    .style.display = "block";

}


const savedToken =
sessionStorage.getItem(
  "booking_access_token"
);

if (savedToken) {

  accessToken = savedToken;

  showDashboard();

}


setInterval(() => {

  if (accessToken) {
    loadBookings();
  }

}, 10000);

</script>

</body>
</html>
