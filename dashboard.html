<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haven Kitchen Bookings</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 20px;
}

h1 {
  text-align: center;
}

.top {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
}

button {
  padding: 10px 15px;
  font-size: 18px;
}

input[type="date"] {
  padding: 8px;
  font-size: 16px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.time {
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>Haven Kitchen Bookings</h1>

<div class="top">
  <button onclick="changeDay(-1)">←</button>

  <input type="date" id="datePicker">

  <button onclick="changeDay(1)">→</button>
</div>

<div id="bookings"></div>

<script>

const SUPABASE_URL = "const SUPABASE_URL = "https://uxyedciaiesddyeibqkt.supabase.co";";
const SUPABASE_KEY = "sb_publishable_TG1Ym_DZwv7iKg2fZEIpog_XwrvTc0R";

const picker = document.getElementById("datePicker");

picker.value = new Date().toISOString().split("T")[0];

picker.addEventListener("change", loadBookings);

async function loadBookings() {

  const date = picker.value;

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/bookings?booking_date=eq.${date}&order=booking_time.asc`,
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await response.json();

  const list = document.getElementById("bookings");

  list.innerHTML = "";

  if (data.length === 0) {
    list.innerHTML = "<p>No bookings for this day.</p>";
    return;
  }

  data.forEach(booking => {

    list.innerHTML += `
      <div class="card">

        <div class="time">
          ${booking.booking_time}
        </div>

        <div>
          <b>${booking.name}</b>
        </div>

        <div>
          Phone: ${booking.phone || "-"}
        </div>

        <div>
          Guests: ${booking.guests}
        </div>

        ${booking.notes
          ? `<div>Notes: ${booking.notes}</div>`
          : ""
        }

      </div>
    `;
  });
}

function changeDay(days) {

  const date = new Date(picker.value + "T00:00:00");

  date.setDate(date.getDate() + days);

  picker.value =
    date.toISOString().split("T")[0];

  loadBookings();
}

loadBookings();

setInterval(loadBookings, 10000);

</script>

</body>
</html>
