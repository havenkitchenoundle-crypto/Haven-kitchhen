<script>

const SUPABASE_URL =
"https://uxyedciaiesddyeibqkt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TG1Ym_DZwv7iKg2fZEIpog_XwrvTc0R";

let accessToken = localStorage.getItem("haven_admin_token");
let refreshToken = localStorage.getItem("haven_admin_refresh_token");

let currentBookings = [];
let selectedBooking = null;


/* LOGIN */

async function login(){

 const email =
 document.getElementById("loginEmail").value.trim();

 const password =
 document.getElementById("loginPassword").value;

 const message =
 document.getElementById("loginMessage");

 message.textContent="Signing in...";

 try{

  const response = await fetch(
   `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
   {
    method:"POST",
    headers:{
     "apikey":SUPABASE_KEY,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     email,
     password
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(
    data.error_description ||
    data.msg ||
    "Login failed."
   );
  }

  saveSession(data);
showAdmin();

 }catch(error){

  message.textContent=error.message;

 }

}

function saveSession(data) {

  accessToken = data.access_token;

  if (data.refresh_token) {
    refreshToken = data.refresh_token;
  }

  localStorage.setItem(
    "haven_admin_token",
    accessToken
  );

  if (refreshToken) {
    localStorage.setItem(
      "haven_admin_refresh_token",
      refreshToken
    );
  }
}


async function refreshSession() {

  if (!refreshToken) {
    return false;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          refresh_token: refreshToken
        })
      }
    );

    if (!response.ok) {
      return false;
    }

    const data = await response.json();

    saveSession(data);

    return true;

  } catch (error) {

    console.error(
      "Session refresh failed:",
      error
    );

    return false;
  }
}


async function authenticatedFetch(url, options = {}) {

  const headers = {
    ...(options.headers || {}),
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${accessToken}`
  };

  let response = await fetch(
    url,
    {
      ...options,
      headers
    }
  );

  if (
    (response.status === 401 ||
     response.status === 403) &&
    refreshToken
  ) {

    const refreshed = await refreshSession();

    if (refreshed) {

      headers["Authorization"] =
        `Bearer ${accessToken}`;

      response = await fetch(
        url,
        {
          ...options,
          headers
        }
      );
    }
  }

  return response;
  }
/* ADMIN */

function showAdmin(){

 document.getElementById("loginScreen")
 .style.display="none";

 document.getElementById("adminApp")
 .style.display="block";

 goToday();

}


function logout() {

  accessToken = null;
  refreshToken = null;

  localStorage.removeItem(
    "haven_admin_token"
  );

  localStorage.removeItem(
    "haven_admin_refresh_token"
  );

  document.getElementById("adminApp")
    .style.display = "none";

  document.getElementById("loginScreen")
    .style.display = "flex";
}


function getLocalDateString(date){

 return `${date.getFullYear()}-${String(
 date.getMonth()+1
 ).padStart(2,"0")}-${String(
 date.getDate()
 ).padStart(2,"0")}`;

}


function goToday(){

 document.getElementById(
 "bookingDate"
 ).value=getLocalDateString(new Date());

 loadBookings();

}


function changeDate(amount){

 const picker =
 document.getElementById("bookingDate");

 if(!picker.value){
  goToday();
  return;
 }

 const p=picker.value.split("-");

 const d=new Date(
  +p[0],
  +p[1]-1,
  +p[2]
 );

 d.setDate(
  d.getDate()+amount
 );

 picker.value=getLocalDateString(d);

 loadBookings();

}


/* LOAD BOOKINGS */

async function loadBookings(){

 if(!accessToken)return;
// Reset all tables before applying current bookings
document.querySelectorAll(".table").forEach(table => {
  table.classList.remove("reserved", "arrived", "cancelled");

  const small = table.querySelector("small");
  if (small) small.textContent = "";

  table.onclick = null;
});
 const date =
 document.getElementById(
 "bookingDate"
 ).value;

 const list =
 document.getElementById(
 "bookingList"
 );

 list.innerHTML =
 '<div class="empty-message">Loading...</div>';

 try{

  const response = await authenticatedFetch(
  `${SUPABASE_URL}/rest/v1/bookings?select=*&booking_date=eq.${date}&order=booking_time.asc`
);

  if(!response.ok){

   if(
    response.status===401 ||
    response.status===403
   ){
    logout();
    throw new Error(
     "Session expired. Please login again."
    );
   }

   throw new Error(
    "Could not load reservations."
   );

  }

  currentBookings =
  await response.json();

  renderBookings();

 }catch(error){

  list.innerHTML =
  `<div class="empty-message">
  ${escapeHtml(error.message)}
  </div>`;

 }

}


/* FILTER */

function filteredBookings(){

 const service =
 document.getElementById(
 "serviceFilter"
 ).value;

 if(service==="all")
  return currentBookings;

 return currentBookings.filter(b=>{

  const bookingTime = String(
  b.booking_time || "00:00"
).substring(0,5);

if(service === "lunch")
  return bookingTime < "16:30";

return bookingTime >= "17:30";

 });

}

 );

cancelledList.innerHTML = "";

/* FLOOR */

function resetFloor(){

 document
 .querySelectorAll(".table")
 .forEach(table=>{

  table.classList.remove(
  "reserved",
  "arrived"
);

  table.onclick = () => {
  const tableNumber = table.dataset.table;
  openWalkInModal(tableNumber);
};

  const small =
  table.querySelector("small");

  if(small)
   small.textContent="";

 });

}


function markBookingOnFloor(
 booking
){

 const tables =
 normalizeTables(
  booking.assigned_tables
 );

 tables.forEach(number=>{

  const table =
  document.querySelector(
   `.table[data-table="${number}"]`
  );

  if(!table)return;

  const status = String(booking.status || "").trim().toLowerCase();
// Booking end time has passed -> table is free
if (booking.end_time) {
  const now = new Date();

  const end = new Date(
    `${booking.booking_date}T${booking.end_time}`
  );

  if (now >= end && status !== "arrived") {
    table.classList.remove("reserved", "arrived");
    return;
  }
}
   if (status === "finished" || status === "cancelled") {
  return;
}
table.classList.remove("reserved", "arrived", "cancelled");

if(status === "arrived"){
    table.classList.add("arrived");
}else{
    table.classList.add("reserved");
}

  const small = table.querySelector("small");

if (small) {

  const startTime = booking.booking_time;
  const endTime = booking.end_time;

  let timeText = formatTime(startTime);

  if (endTime) {
    timeText += ` → ${formatTime(endTime)}`;
  }

  let remainingText = "";

  if (status === "arrived" && endTime) {

    const now = new Date();

    const end = new Date(
      `${booking.booking_date}T${endTime}`
    );

    const remainingMinutes =
      Math.ceil((end - now) / 60000);

    if (remainingMinutes > 0) {
      remainingText =
        ` · ${remainingMinutes} min left`;
    } else {
      remainingText =
        ` · Time finished`;
    }
  }

  small.textContent =
    `${timeText}${remainingText}`;
}

  table.onclick = () => {
  const status = String(booking.status || "")
    .trim()
    .toLowerCase();

  // Masada müşteri zaten oturuyorsa booking'i aç
  if (status === "arrived") {
    openBooking(booking);
    return;
  }

  // Henüz gelmemiş rezervasyon varsa,
  // masa Walk In için seçilebilir
  if (status !== "finished" && status !== "cancelled") {
    openWalkInModal(number);
    return;
  }

  openBooking(booking);
};

});
}

setInterval(() => {
  if (typeof loadBookings === "function") {
    loadBookings();
  }
}, 60000);


function normalizeTables(value){

 if(Array.isArray(value))
  return value.map(Number);

 if(!value)
  return [];

 if(typeof value==="string"){

  return value
  .replace(/[{}\[\]]/g,"")
  .split(",")
  .map(x=>Number(x.trim()))
  .filter(Number.isFinite);

 }

 return [];

}

async function saveReservationChanges() {

  const newDate =
    document.getElementById("editBookingDate").value;

  const newTime =
    document.getElementById("editBookingTime").value;

      `${SUPABASE_URL}/rest/v1/bookings?id=eq.${encodeURIComponent(selectedBooking.id)}`,

/* HELPERS */

function formatTime(value){

 if(!value)
  return "--:--";

 return String(value)
 .substring(0,5);

}


function formatDuration(minutes){

 const m=Number(minutes);

 if(!m)
  return "-";

 const hours =
 Math.floor(m/60);

 const mins =
 m%60;

 if(!mins)
  return `${hours} hours`;

 return `${hours}h ${mins}m`;

}


function escapeHtml(value){

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}

async function loadWalkInTableOptions() {

  const guests =
    Number(
      document.getElementById("walkInGuests").value
    );

  const select =
    document.getElementById("walkInTableChoice");

  const message =
    document.getElementById("walkInMessage");

  select.innerHTML =
    '<option value="">Choose table(s)</option>';

  message.textContent = "";

  if (!guests || guests < 1) {
    return;
  }

  try {

    const today =
      getLocalDateString(new Date());

    const now = new Date();

    const nowMinutes =
      now.getHours() * 60 +
      now.getMinutes();


    /* LOAD TABLES */

    const tablesResponse =
      await authenticatedFetch(
        `${SUPABASE_URL}/rest/v1/restaurant_tables?active=eq.true&select=table_number,capacity&order=table_number.asc`
      );


    /* LOAD COMBINATIONS */

    const combinationsResponse =
      await authenticatedFetch(
        `${SUPABASE_URL}/rest/v1/table_combinations?active=eq.true&select=id,table_numbers,min_capacity,max_capacity&order=id.asc`
      );


    /* LOAD TODAY BOOKINGS */

    const bookingsResponse =
      await authenticatedFetch(
        `${SUPABASE_URL}/rest/v1/bookings?booking_date=eq.${today}&select=assigned_tables,booking_time,end_time,status`
      );


    if (
      !tablesResponse.ok ||
      !combinationsResponse.ok ||
      !bookingsResponse.ok
    ) {
      throw new Error(
        "Could not load tables."
      );
    }


    const tables =
      await tablesResponse.json();

    const combinations =
      await combinationsResponse.json();

    const bookings =
      await bookingsResponse.json();


    /* FIND TABLES CURRENTLY IN USE */

    const occupied =
      new Set();


    bookings.forEach(booking => {

      const status =
        String(
          booking.status || ""
        )
        .trim()
        .toLowerCase();


      if (
        status === "cancelled" ||
        status === "finished"
      ) {
        return;
      }


      const startParts =
        String(
          booking.booking_time ||
          "00:00"
        ).split(":");


      const endParts =
        String(
          booking.end_time ||
          booking.booking_time ||
          "00:00"
        ).split(":");


      const startMinutes =
        Number(startParts[0]) * 60 +
        Number(startParts[1]);


      const endMinutes =
        Number(endParts[0]) * 60 +
        Number(endParts[1]);


      if (
        nowMinutes >= startMinutes &&
        nowMinutes < endMinutes
      ) {

        normalizeTables(
          booking.assigned_tables
        ).forEach(table => {

          occupied.add(
            Number(table)
          );

        });

      }

    });


    const options = [];


    /* SINGLE TABLE OPTIONS */

    tables
      .filter(table => {

        return (
          Number(table.capacity) >= guests &&
          !occupied.has(
            Number(table.table_number)
          )
        );

      })
      .forEach(table => {

        options.push({

          tables: [
            Number(table.table_number)
          ],

          label:
            `Table ${table.table_number} ` +
            `(capacity ${table.capacity})`,

          numberOfTables: 1,

          capacity:
            Number(table.capacity)

        });

      });


    /* TABLE COMBINATIONS */

    combinations
      .filter(combo => {

        const comboTables =
          normalizeTables(
            combo.table_numbers
          );


        const capacityOK =
          Number(
            combo.min_capacity || 1
          ) <= guests
          &&
          Number(
            combo.max_capacity
          ) >= guests;


        const allFree =
          comboTables.every(
            table =>
              !occupied.has(
                Number(table)
              )
          );


        return (
          capacityOK &&
          allFree &&
          comboTables.length > 0
        );

      })
      .forEach(combo => {

        const comboTables =
          normalizeTables(
            combo.table_numbers
          );


        options.push({

          tables: comboTables,

          label:
            `Tables ${comboTables.join(" + ")} ` +
            `(up to ${combo.max_capacity})`,

          numberOfTables:
            comboTables.length,

          capacity:
            Number(combo.max_capacity)

        });

      });


    /* BEST OPTIONS FIRST */

    options.sort((a, b) =>

      a.numberOfTables -
      b.numberOfTables

      ||

      a.capacity -
      b.capacity

      ||

      a.tables[0] -
      b.tables[0]

    );


    /* SHOW OPTIONS */

    options.forEach(option => {

      const item =
        document.createElement(
          "option"
        );

      item.value =
        option.tables.join(",");

      item.textContent =
        option.label;

      select.appendChild(item);

    });


    if (!options.length) {

      message.style.color =
        "#ff7777";

      message.textContent =
        "No suitable tables available right now.";

    }


    /* IF FLOOR TABLE WAS CLICKED */

    if (selectedWalkInTable) {

      const preferred =
        options.find(option =>
          option.tables.includes(
            Number(selectedWalkInTable)
          )
        );

      if (preferred) {

        select.value =
          preferred.tables.join(",");

      }

    }


  } catch (error) {

    console.error(error);

    message.style.color =
      "#ff7777";

    message.textContent =
      "Could not load available tables.";

  }

}


document
.getElementById("walkInForm")
.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const guests =
      Number(
        document.getElementById(
          "walkInGuests"
        ).value
      );


    const selected =
      document.getElementById(
        "walkInTableChoice"
      ).value;


    const message =
      document.getElementById(
        "walkInMessage"
      );


    if (!guests || guests < 1) {

      message.style.color =
        "#ff7777";

      message.textContent =
        "Please enter number of guests.";

      return;

    }


    if (!selected) {

      message.style.color =
        "#ff7777";

      message.textContent =
        "Please choose a table.";

      return;

    }


    const selectedTables =
      selected
        .split(",")
        .map(Number)
        .filter(Number.isFinite);


    const submitButton =
      this.querySelector(
        'button[type="submit"]'
      );


    submitButton.disabled = true;

    submitButton.textContent =
      "Seating...";


    try {

      const response = await authenticatedFetch(
  `${SUPABASE_URL}/rest/v1/rpc/create_walk_in`,
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      p_guests: guests,
      p_tables: selectedTables
    })
  }
);

if (!response.ok) {
  const errorText = await response.text();
  throw new Error(errorText);
}

const result = await response.json();

if (result !== true) {
  throw new Error("Table is no longer available.");
}

this.reset();
closeWalkInModal();
await loadBookings();

} catch (error) {

  console.error(error);

  message.style.color = "#ff7777";
  message.textContent =
  "ERROR: " + error.message;

  await loadWalkInTableOptions();

} finally {

  submitButton.disabled = false;
  submitButton.textContent = "Seat Walk In";

}

});
  /* =========================================
   DRAG & DROP TABLES - MOBILE + DESKTOP
========================================= */

(function () {

    let dragTable = null;
    let holdTimer = null;
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    const HOLD_TIME = 500;

    document.querySelectorAll(".floor .table").forEach(table => {

        table.addEventListener("pointerdown", function(e) {

            const currentTable = this;

            holdTimer = setTimeout(() => {

                dragging = true;
                dragTable = currentTable;

                const rect = dragTable.getBoundingClientRect();

                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                dragTable.style.zIndex = "9999";
                dragTable.style.opacity = "0.8";

                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }

            }, HOLD_TIME);

        });

        table.addEventListener("pointermove", function(e) {

            if (!dragging || dragTable !== this) return;

            e.preventDefault();

            const floor = document.querySelector(".floor");
            const floorRect = floor.getBoundingClientRect();

            let x =
                e.clientX -
                floorRect.left -
                offsetX;

            let y =
                e.clientY -
                floorRect.top -
                offsetY;

            x = Math.max(
                0,
                Math.min(
                    x,
                    floor.clientWidth - dragTable.offsetWidth
                )
            );

            y = Math.max(
                0,
                Math.min(
                    y,
                    floor.clientHeight - dragTable.offsetHeight
                )
            );

            dragTable.style.left = x + "px";
            dragTable.style.top = y + "px";

        });

        table.addEventListener("pointerup", function(e) {

            clearTimeout(holdTimer);

            if (dragging && dragTable === this) {

                e.preventDefault();
                e.stopPropagation();

                const tableNumber =
                    dragTable.dataset.table;

                localStorage.setItem(
                    "table-position-" + tableNumber,
                    JSON.stringify({
                        left: dragTable.style.left,
                        top: dragTable.style.top
                    })
                );

                dragTable.style.zIndex = "";
                dragTable.style.opacity = "";

                setTimeout(() => {
                    dragging = false;
                    dragTable = null;
                }, 100);

            }

        });

        table.addEventListener("pointercancel", function() {
            clearTimeout(holdTimer);
            dragging = false;

            if (dragTable) {
                dragTable.style.zIndex = "";
                dragTable.style.opacity = "";
            }

            dragTable = null;
        });

        /* LOAD SAVED POSITION */

        const saved =
            localStorage.getItem(
                "table-position-" + table.dataset.table
            );

        if (saved) {

            try {

                const position = JSON.parse(saved);

                table.style.left = position.left;
                table.style.top = position.top;

            } catch (e) {}

        }

    });

})();
  let changingTable = false;

function startChangeTable() {
    if (!selectedBooking) return;

    changingTable = true;

    // Reservation modalını kapat ama selectedBooking'i silme
    document
        .getElementById("bookingModal")
        .classList.remove("open");

    alert("Select the new table on the Floor Plan.");
}

document.querySelectorAll(".table").forEach(table => {

    table.addEventListener("click", async function(e) {

        if (!changingTable || !selectedBooking) return;

        e.stopPropagation();

        const newTable = Number(this.dataset.table);

        if (!newTable) return;

        const ok = confirm(
            "Move this reservation to Table " + newTable + "?"
        );

        if (!ok) return;

        try {

            const response = await authenticatedFetch(
                `${SUPABASE_URL}/rest/v1/bookings?id=eq.${encodeURIComponent(selectedBooking.id)}`,
                {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
    assigned_tables: [newTable]
})
                }
            );

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText);
            }

            changingTable = false;

            alert("Table changed successfully.");

            await loadBookings();

        } catch(error) {

            console.error(error);

            alert(
                "Could not change table: " +
                error.message
            );
        }

    }, true);

});
  function openCalendar() {
    const input = document.getElementById("bookingDate");

    if (input.showPicker) {
        input.showPicker();
    } else {
        input.click();
    }
  }
  function toggleBookingSection(listId, arrowId) {
    const list = document.getElementById(listId);
    const arrow = document.getElementById(arrowId);

    if (list.style.display === "none") {
        list.style.display = "";
        arrow.textContent = "▼";
    } else {
        list.style.display = "none";
        arrow.textContent = "▶";
    }
  }
